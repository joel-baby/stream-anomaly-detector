name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  producer:
    name: Producer - Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (typecheck)
        run: pnpm --filter producer lint
      - name: Build
        run: pnpm --filter producer build

  consumer:
    name: Consumer - Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (typecheck)
        run: pnpm --filter consumer lint
      - name: Build
        run: pnpm --filter consumer build

  api:
    name: API - Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (typecheck)
        run: pnpm --filter api lint
      - name: Build
        run: pnpm --filter api build

  worker:
    name: Worker - Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (typecheck)
        run: pnpm --filter worker lint
      - name: Build
        run: pnpm --filter worker build

  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (ESLint)
        run: pnpm --filter frontend lint
      - name: Build
        run: pnpm --filter frontend build
